services:
  ollama:
    image: ollama/ollama:latest
    container_name: local-llm-api
    restart: unless-stopped

    ports:
      - "8000:11434"   

    volumes:
      - ollama_data:/root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  ollama_data: